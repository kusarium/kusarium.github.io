media:
  - name: post_images
    label: 文章插畫
    input: src/assets/images/posts
    output: /assets/images/posts
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe

content:
  - name: posts
    label: 文章與插畫
    type: collection
    path: src/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      primary: title
      fields: [title, date, draft]
      sort: date
      order: desc
      search: [title, excerpt, topics]
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: date
        label: 發布時間
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: excerpt
        label: 列表摘要
        type: text
        required: true
      - name: cover
        label: 封面插畫
        type: image
        required: false
        options:
          media: post_images
          extensions: [jpg, jpeg, png, webp, gif, svg]
          rename: safe
      - name: coverAlt
        label: 封面內容說明
        description: 為無法看到圖片的訪客簡短描述畫面。
        type: string
        required: false
      - name: coverCaption
        label: 封面下方說明
        type: string
        required: false
      - name: topics
        label: 標籤
        type: string
        list: true
        required: false
      - name: draft
        label: 暫存為草稿
        description: 開啟後文章不會出現在公開網站。
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          media: post_images
          extensions: [jpg, jpeg, png, webp, gif, svg]

  - name: site
    label: 站點資料
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: name
        label: 英文站名
        type: string
        required: true
      - name: subtitle
        label: 網站副標
        type: string
        required: true
      - name: author
        label: 作者名
        type: string
        required: true
      - name: tagline
        label: 首頁短句
        type: string
        required: true
      - name: description
        label: 網站介紹
        type: text
        required: true
      - name: established
        label: 建園年份
        type: string
        required: true
      - name: copyrightNotice
        label: 版權說明
        type: text
        required: true
      - name: url
        label: 網站地址
        type: string
        readonly: true
      - name: language
        label: 頁面語言
        type: string
        readonly: true
      - name: locale
        label: 地區代碼
        type: string
        readonly: true
