media:
  - name: post_images
    label: 文章插畫
    input: src/assets/images/posts
    output: /assets/images/posts
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe
  - name: site_images
    label: 站點圖片
    input: src/assets/images/site
    output: /assets/images/site
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe

content:
  - name: posts
    label: 文章與插畫
    type: collection
    path: src/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      primary: title
      fields: [title, date, language, draft]
      sort: date
      order: desc
      search: [title, excerpt, topics]
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: date
        label: 發布時間
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: language
        label: 正文字形
        description: 簡體文章選「簡體中文」，可避免個別字回退成另一套字形。
        type: select
        required: true
        default: zh-Hans
        options:
          values:
            - name: zh-Hans
              label: 簡體中文
            - name: zh-Hant
              label: 繁體中文
      - name: excerpt
        label: 列表摘要
        type: text
        required: true
      - name: coverCard
        label: 文字封面（可選）
        description: 選擇一款可編輯的檔案卡；如同時上傳封面插畫，插畫優先。樣式預覽：https://kusarium.github.io/cover-studio/
        type: object
        required: false
        fields:
          - name: template
            label: 封面樣式
            type: select
            required: false
            options:
              placeholder: 選擇文字封面
              values:
                - name: night
                  label: 01 夜幕（深灰 × 薄荷）
                - name: mist
                  label: 02 晨霧（霧白 × 薄荷）
                - name: afterglow
                  label: 03 餘暉（柔黃 × 灰）
                - name: cabinet
                  label: 04 索引櫃（紙白 × 墨灰）
          - name: eyebrow
            label: 眉標
            description: 封面最上方的小字；留空時顯示 KUSARIUM · ARCHIVE CARD。
            type: string
            required: false
          - name: title
            label: 封面主標
            description: 最大的一行文字；留空時使用文章標題。
            type: string
            required: false
          - name: subtitle
            label: 封面副標
            description: 主標下方文字；留空時使用第一個標籤。
            type: string
            required: false
          - name: note
            label: 角落註記
            description: 適合放英文短句或作品類型。
            type: string
            required: false
          - name: number
            label: 封面編號
            description: 右上角文字；留空時使用發布日期。
            type: string
            required: false
      - name: cover
        label: 封面插畫
        type: image
        required: false
        options:
          media: post_images
          extensions: [jpg, jpeg, png, webp, gif, svg]
          rename: safe
      - name: coverAlt
        label: 封面內容說明
        description: 為無法看到圖片的訪客簡短描述畫面。
        type: string
        required: false
      - name: coverCaption
        label: 封面下方說明
        type: string
        required: false
      - name: topics
        label: 標籤
        type: string
        list: true
        required: false
      - name: draft
        label: 暫存為草稿
        description: 開啟後文章不會出現在公開網站。
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          media: post_images
          extensions: [jpg, jpeg, png, webp, gif, svg]

  - name: site
    label: 站點資料
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: name
        label: 英文站名
        type: string
        required: true
      - name: subtitle
        label: 導覽列副標
        description: 顯示在全站頁首與頁尾；首頁的「電子植物園（檔案館）」另在首頁設定修改。
        type: string
        required: true
      - name: author
        label: 作者名
        type: string
        required: true
      - name: tagline
        label: 首頁短句
        type: string
        required: true
      - name: description
        label: 網站介紹
        type: text
        required: true
      - name: established
        label: 建園年份
        type: string
        required: true
      - name: copyrightNotice
        label: 版權說明
        type: text
        required: true
      - name: home
        label: 首頁設定
        type: object
        required: true
        fields:
          - name: heroEyebrow
            label: 首頁眉標
            type: string
            required: true
          - name: heroSubtitle
            label: 首頁站名說明
            description: 「電子植物園（檔案館）」只在這裡出現。
            type: string
            required: true
          - name: heroJapanese
            label: 首頁日文短句
            type: text
            required: true
          - name: archiveCard
            label: 首頁檔案卡
            description: 邊框固定保留；可以選漸變底色或上傳圖片，並自由修改卡片文字。
            type: object
            required: true
            fields:
              - name: backgroundStyle
                label: 底色樣式
                type: select
                required: true
                options:
                  values:
                    - name: soft
                      label: 柔霧（目前樣式）
                    - name: mint
                      label: 薄荷
                    - name: yellow
                      label: 柔黃
                    - name: night
                      label: 夜幕
              - name: backgroundImage
                label: 自訂底圖
                description: 上傳後會覆蓋所選漸變底色；刪除此欄即可恢復漸變。
                type: image
                required: false
                options:
                  media: site_images
                  extensions: [jpg, jpeg, png, webp, gif, svg]
                  rename: safe
              - name: backgroundAlt
                label: 底圖內容說明
                type: string
                required: false
              - name: imagePosition
                label: 底圖取景位置
                type: select
                required: true
                options:
                  values:
                    - name: center
                      label: 居中
                    - name: top
                      label: 靠上
                    - name: bottom
                      label: 靠下
                    - name: left
                      label: 靠左
                    - name: right
                      label: 靠右
              - name: imageTint
                label: 在圖片上保留淡色襯底
                description: 文字不清楚時開啟；使用已排好文字的完整圖片時可以關閉。
                type: boolean
                default: true
              - name: showText
                label: 顯示卡片文字
                description: 若上傳的圖片本身已帶文字，可以關閉。
                type: boolean
                default: true
              - name: eyebrow
                label: 左上小字
                type: string
                required: true
              - name: number
                label: 右上編號
                type: string
                required: true
              - name: wordOne
                label: 主字一
                type: string
                required: true
              - name: wordTwo
                label: 主字二
                type: string
                required: true
              - name: wordThree
                label: 主字三
                type: string
                required: true
              - name: wordFour
                label: 主字四
                type: string
                required: true
              - name: note
                label: 右下註記
                description: 可以換行。
                type: text
                required: true
          - name: introduction
            label: 首頁介紹
            type: object
            required: true
            fields:
              - name: eyebrow
                label: 眉標
                type: string
                required: true
              - name: title
                label: 中文標題
                type: string
                required: true
              - name: titleJapanese
                label: 日文標題
                type: string
                required: true
              - name: textChinese
                label: 中文介紹
                type: text
                required: true
              - name: textJapanese
                label: 日文介紹
                type: text
                required: true
          - name: keeper
            label: 首頁園丁簡介
            description: 圖片沿用下方「園丁室設定」中的個人圖片。
            type: object
            required: true
            fields:
              - name: eyebrow
                label: 眉標
                type: string
                required: true
              - name: title
                label: 標題
                type: string
                required: true
              - name: summary
                label: 簡介
                type: text
                required: true
              - name: buttonLabel
                label: 按鈕文字
                type: string
                required: true
      - name: about
        label: 園丁室設定
        type: object
        required: true
        fields:
          - name: pageEyebrow
            label: 頁面眉標
            type: string
            required: true
          - name: pageTitle
            label: 頁面標題
            type: string
            required: true
          - name: pageIntro
            label: 頁面短句
            type: text
            required: true
          - name: portraitImage
            label: 園丁圖片
            description: 同時顯示在首頁園丁簡介與園丁室；留空時使用目前的文字卡片。
            type: image
            required: false
            options:
              media: site_images
              extensions: [jpg, jpeg, png, webp, gif, svg]
              rename: safe
          - name: portraitAlt
            label: 圖片內容說明
            type: string
            required: false
          - name: portraitPosition
            label: 圖片取景位置
            type: select
            required: true
            options:
              values:
                - name: center
                  label: 居中
                - name: top
                  label: 靠上
                - name: bottom
                  label: 靠下
                - name: left
                  label: 靠左
                - name: right
                  label: 靠右
          - name: portraitTint
            label: 在圖片上保留淡色襯底
            type: boolean
            default: true
          - name: showPortraitText
            label: 在圖片上顯示文字
            description: 若圖片本身已帶字，可以關閉。
            type: boolean
            default: true
          - name: portraitTitle
            label: 圖片主標
            type: string
            required: true
          - name: portraitNote
            label: 圖片底部小字
            type: string
            required: true
          - name: profileEyebrow
            label: 個人介紹眉標
            type: string
            required: true
          - name: profileTitle
            label: 個人名稱
            type: string
            required: true
          - name: profileChinese
            label: 中文個人介紹
            type: text
            required: true
          - name: profileJapanese
            label: 日文個人介紹
            type: text
            required: true
          - name: siteHeading
            label: 站名說明標題
            type: string
            required: true
          - name: siteChinese
            label: 中文站名說明
            type: text
            required: true
          - name: siteJapanese
            label: 日文站名說明
            type: text
            required: true
      - name: url
        label: 網站地址
        type: string
        readonly: true
      - name: language
        label: 頁面語言
        type: string
        readonly: true
      - name: locale
        label: 地區代碼
        type: string
        readonly: true
