media:
  - name: post_images
    label: 文章插畫
    input: src/assets/images/posts
    output: /assets/images/posts
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe
  - name: site_images
    label: 站點圖片
    input: src/assets/images/site
    output: /assets/images/site
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe
  - name: character_images
    label: 人物頭像
    input: src/assets/images/characters
    output: /assets/images/characters
    extensions: [jpg, jpeg, png, webp, gif, svg]
    rename: safe

content:
  - name: posts
    label: 文章與插畫
    type: collection
    path: src/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      primary: title
      fields: [title, date, section, language, passwordProtected, draft]
      sort: date
      order: desc
      search: [title, excerpt, topics]
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: date
        label: 發布時間
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
      - name: section
        label: 發布位置
        description: 一般內容放在「生長記」；翻譯存檔選「地下室」，不會出現在公開導覽、標籤或搜尋引擎站點地圖中。
        type: select
        required: true
        default: journal
        options:
          values:
            - name: journal
              label: 生長記（公開）
            - name: basement
              label: 地下室（需要密碼）
      - name: language
        label: 正文字形
        description: 簡體文章選「簡體中文」，可避免個別字回退成另一套字形。
        type: select
        required: true
        default: zh-Hans
        options:
          values:
            - name: zh-Hans
              label: 簡體中文
            - name: zh-Hant
              label: 繁體中文
      - name: excerpt
        label: 列表摘要
        type: text
        required: true
      - name: showToc
        label: 顯示本文目錄
        description: 自動收集正文中的「標題 2」和「標題 3」，點擊即可跳轉。沒有小標題時不會顯示。
        type: boolean
        default: true
      - name: tocTitle
        label: 目錄標題
        description: 留空時顯示「本文目錄」。
        type: string
        required: false
      - name: passwordProtected
        label: 這篇文章需要密碼
        description: 普通文章開啟後，列表仍顯示標題、摘要和提示，正文需解鎖。地下室文章無論此項是否開啟都會上鎖。
        type: boolean
        default: false
      - name: passwordHint
        label: 單篇密碼提示
        description: 普通上鎖文章請填；地下室文章留空時沿用地下室提示。
        type: string
        required: false
      - name: password
        label: 單篇密碼
        description: 普通上鎖文章請填；地下室文章留空時沿用地下室密碼。注意：GitHub 倉庫是公開的，這只能阻擋一般訪客，不能當成真正的私密保管。
        type: string
        required: false
      - name: coverCard
        label: 文字封面（可選）
        description: 選擇一款可編輯的檔案卡；如同時上傳封面插畫，插畫優先。樣式預覽：https://kusarium.github.io/cover-studio/
        type: object
        required: false
        fields:
          - name: template
            label: 封面樣式
            type: select
            required: false
            options:
              placeholder: 選擇文字封面
              values:
                - name: night
                  label: 01 夜幕（深灰 × 薄荷）
                - name: mist
                  label: 02 晨霧（霧白 × 薄荷）
                - name: afterglow
                  label: 03 餘暉（柔黃 × 灰）
                - name: cabinet
                  label: 04 索引櫃（紙白 × 墨灰）
          - name: eyebrow
            label: 眉標
            description: 封面最上方的小字；留空時顯示 KUSARIUM · ARCHIVE CARD。
            type: string
            required: false
          - name: title
            label: 封面主標
            description: 最大的一行文字；留空時使用文章標題。
            type: string
            required: false
          - name: subtitle
            label: 封面副標
            description: 主標下方文字；留空時使用第一個標籤。
            type: string
            required: false
          - name: note
            label: 角落註記
            description: 適合放英文短句或作品類型。
            type: string
            required: false
          - name: number
            label: 封面編號
            description: 右上角文字；留空時使用發布日期。
            type: string
            required: false
      - name: cover
        label: 封面插畫
        description: 如需直接裁掉多餘範圍，可先使用圖片取景台：https://kusarium.github.io/image-crop/
        type: image
        required: false
        options:
          media: post_images
          extensions: [jpg, jpeg, png, webp, gif, svg]
          rename: safe
      - name: coverFocusX
        label: 封面水平焦點（%）
        description: 列表與葉影帖取景使用；0 靠左、50 居中、100 靠右。
        type: number
        required: false
        default: 50
        options:
          min: 0
          max: 100
      - name: coverFocusY
        label: 封面垂直焦點（%）
        description: 0 靠上、50 居中、100 靠下。
        type: number
        required: false
        default: 50
        options:
          min: 0
          max: 100
      - name: coverZoom
        label: 封面放大（%）
        description: 100 為原始取景；數字越大，裁掉的周圍越多。建議不超過 180。
        type: number
        required: false
        default: 100
        options:
          min: 100
          max: 300
      - name: coverAlt
        label: 封面內容說明
        description: 為無法看到圖片的訪客簡短描述畫面。
        type: string
        required: false
      - name: coverCaption
        label: 封面下方說明
        type: string
        required: false
      - name: topics
        label: 標籤
        type: string
        list: true
        required: false
      - name: draft
        label: 暫存為草稿
        description: 開啟後文章不會出現在公開網站。
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown
          media: post_images
          extensions: [jpg, jpeg, png, webp, gif, svg]

