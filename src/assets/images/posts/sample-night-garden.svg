<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">夜間溫室示例封面</title>
  <desc id="desc">雨雲灰底上的繁體標題、檔案編號與薄荷、柔黃、霧灰三色色條。</desc>
  <defs>
    <radialGradient id="mintGlow" cx="0" cy="1" r="1.1">
      <stop offset="0" stop-color="#abd9cf" stop-opacity=".52"/>
      <stop offset="1" stop-color="#abd9cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowGlow" cx="1" cy="0" r=".9">
      <stop offset="0" stop-color="#feebbe" stop-opacity=".36"/>
      <stop offset="1" stop-color="#feebbe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="820" fill="#4c4948"/>
  <rect width="1200" height="820" fill="url(#mintGlow)"/>
  <rect width="1200" height="820" fill="url(#yellowGlow)"/>

  <path d="M72 88H1128M72 676H1128" stroke="#efefef" stroke-opacity=".34"/>
  <path d="M72 714H566" stroke="#abd9cf" stroke-width="12"/>
  <path d="M566 714H786" stroke="#feebbe" stroke-width="12"/>
  <path d="M786 714H1128" stroke="#d3d3d4" stroke-width="12"/>

  <text x="72" y="58" fill="#efefef" font-family="sans-serif" font-size="17" font-weight="700" letter-spacing="7">KUSARIUM · ARCHIVE CARD</text>
  <text x="1128" y="58" fill="#b5b5b6" font-family="sans-serif" font-size="17" text-anchor="end" letter-spacing="4">001 / 2026</text>

  <text x="106" y="350" fill="#efefef" font-family="serif" font-size="190" font-weight="300" letter-spacing="18">夜間</text>
  <text x="108" y="500" fill="#efefef" font-family="serif" font-size="92" font-weight="300" letter-spacing="24">溫室記錄</text>
  <text x="1118" y="582" fill="#feebbe" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="end" letter-spacing="10">NIGHT NOTE</text>

  <circle cx="1088" cy="126" r="17" fill="#feebbe"/>
  <path d="M1088 150V316" stroke="#efefef" stroke-opacity=".34"/>
  <text x="1118" y="751" fill="#efefef" font-family="sans-serif" font-size="15" text-anchor="end" letter-spacing="5">COLLECTED SLOWLY</text>
